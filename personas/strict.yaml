# Strict: says no to almost everything, and asks before anything else.
owner: strict
device: approvals-app
default: decline
rules:
  - match: { purpose: research, ethics_approved: true, audit_certified: true }
    decision: ask
negotiation:
  join_collectives: false
trust:                       # whose signatures count; anyone else's approval counts as none
  issuers: [issuer.lake.local]
  auditors: [audit.lake.local]
  ethics: [ethics.lake.local]
  payments: [payments.lake.local]
