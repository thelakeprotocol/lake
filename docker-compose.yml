# The Lake: a node with the live map, an issuer, and three houses with different rules.
#   docker compose up                 (pulls images; add --build to build from source)
#   open http://localhost:7000        (the live map)
#   docker compose run --rm lake knock http://house-stan:4000 --offer gp
#   docker compose run --rm lake dispatch --extra-fields postcode --wait 30
#   open http://localhost:4001/owner/    (strict's owner: tap Allow; from a phone, set LAKE_PUBLIC_HOST=<laptop LAN IP>)
# Join from anywhere on this machine:
#   docker run --network lake_default --hostname house-you \
#     -v ./personas/research.yaml:/rules.yaml ghcr.io/thelakeprotocol/lake-house --name you
name: lake

x-house: &house
  build: { context: ., target: house }
  image: ghcr.io/thelakeprotocol/lake-house:latest
  depends_on: [issuer, auditor, lake-node]
  restart: unless-stopped
  environment: { LAKE_NODE_URL: "http://lake-node:7000,http://lake-node-b:7000", LAKE_SEED: "42" }

services:
  # Two nodes that follow each other. Anyone can run one; stop either and the Lake carries on:
  #   docker stop lake-node-a
#   docker compose run --rm lake reset      (demo reset, under a second)
  lake-node:
    build: { context: ., target: node }
    image: ghcr.io/thelakeprotocol/lake-node:latest
    container_name: lake-node-a
    hostname: lake-node
    command: ["--domain", "lake.local", "--url", "http://lake-node:7000", "--follow", "http://lake-node-b:7000"]
    environment: { LAKE_APPROVALS_URL: "http://${LAKE_PUBLIC_HOST:-localhost}:4001/owner/", LAKE_RESET_TOKEN: "${LAKE_RESET_TOKEN:-demo}" }
    volumes: [node:/data]
    ports: ["7000:7000"]

  lake-node-b:
    image: ghcr.io/thelakeprotocol/lake-node:latest
    container_name: lake-node-b
    hostname: lake-node-b
    command: ["--domain", "b.lake.local", "--url", "http://lake-node-b:7000", "--follow", "http://lake-node:7000"]
    environment: { LAKE_RESET_TOKEN: "${LAKE_RESET_TOKEN:-demo}" }
    volumes: [node-b:/data]
    ports: ["7001:7000"]
    depends_on: [lake-node]

  issuer:
    build: { context: ., target: specialists }
    image: ghcr.io/thelakeprotocol/lake-specialists:latest
    command: ["issuer", "--url", "http://issuer:4300"]
    depends_on: [lake-node]
    environment: { LAKE_NODE_URL: "http://lake-node:7000,http://lake-node-b:7000" }
    volumes: [issuer:/data]

  auditor:
    build: { context: ., target: specialists }
    image: ghcr.io/thelakeprotocol/lake-specialists:latest
    hostname: auditor
    command: ["auditor", "--url", "http://auditor:4400"]
    depends_on: [lake-node]
    environment: { LAKE_NODE_URL: "http://lake-node:7000,http://lake-node-b:7000" }
    volumes: [auditor:/data]

  ethics:
    build: { context: ., target: specialists }
    image: ghcr.io/thelakeprotocol/lake-specialists:latest
    hostname: ethics
    command: ["ethics", "--url", "http://ethics:4500"]
    depends_on: [lake-node]
    environment: { LAKE_NODE_URL: "http://lake-node:7000,http://lake-node-b:7000" }
    volumes: [ethics:/data]

  payments:
    build: { context: ., target: specialists }
    image: ghcr.io/thelakeprotocol/lake-specialists:latest
    hostname: payments
    command: ["payments", "--url", "http://payments:4600"]
    depends_on: [lake-node]
    environment: { LAKE_NODE_URL: "http://lake-node:7000,http://lake-node-b:7000" }
    volumes: [payments:/data]

  house-stan:
    <<: *house
    hostname: house-stan
    command: ["--name", "stan"]
    volumes: [stan:/data, ./personas/stan.yaml:/rules.yaml:ro]
    ports: ["4000:4000"]

  house-strict:
    <<: *house
    hostname: house-strict
    command: ["--name", "strict"]
    volumes: [strict:/data, ./personas/strict.yaml:/rules.yaml:ro]
    ports: ["4001:4000"]
    # Sandbox demo: the first phone to open the approvals app becomes the owner.
    environment: { LAKE_NODE_URL: "http://lake-node:7000,http://lake-node-b:7000", LAKE_SEED: "42", LAKE_OPEN_PAIRING: "1", LAKE_OWNER_URL: "http://${LAKE_PUBLIC_HOST:-localhost}:4001" }

  house-research:
    <<: *house
    hostname: house-research
    command: ["--name", "research"]
    volumes: [research:/data, ./personas/research.yaml:/rules.yaml:ro]

  # The scale run: 250 hosted houses per container, each its own WebID, pod, wallet, card and rules.
  #   docker compose --profile scale up -d --scale house-multi=4      (about 1,000 houses)
  house-multi:
    build: { context: ., target: house }
    image: ghcr.io/thelakeprotocol/lake-house:latest
    profiles: [scale]
    command: ["--tenants", "250"]
    depends_on: [issuer, auditor, lake-node]
    environment: { LAKE_NODE_URL: "http://lake-node:7000,http://lake-node-b:7000", LAKE_SEED: "42" }
    restart: unless-stopped

  # Background life: ordinary traders, and an attacker now and then. The Lake defends itself.
  swarm:
    build: { context: ., target: cli }
    image: ghcr.io/thelakeprotocol/lake:latest
    command: ["swarm", "--traders", "6", "--attackers", "1", "--interval", "2500"]
    depends_on: [house-stan, house-strict, house-research]
    environment: { LAKE_NODE_URL: "http://lake-node:7000,http://lake-node-b:7000" }
    restart: unless-stopped

  lake:
    build: { context: ., target: cli }
    image: ghcr.io/thelakeprotocol/lake:latest
    profiles: [cli]
    environment: { LAKE_NODE_URL: "http://lake-node:7000,http://lake-node-b:7000", LAKE_RESET_TOKEN: "${LAKE_RESET_TOKEN:-demo}" }
    volumes: [cli:/root/.lake]   # the agent's keys survive between runs

volumes: { cli: {}, node: {}, node-b: {}, issuer: {}, auditor: {}, ethics: {}, payments: {}, stan: {}, strict: {}, research: {} }
