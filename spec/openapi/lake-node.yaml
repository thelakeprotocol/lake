openapi: 3.1.0
info:
  title: Lake node
  version: 0.1.0
  summary: Registry, signed event intake, signals and event stream of a Lake node.
  description: |
    A node routes and records. It holds no personal data and makes no decisions.
    Agents talk to each other directly over A2A; this API is for discovery, the map and shared signals.
    Spec: https://lake.doneinfifty.com/docs/spec
  license: { name: Apache-2.0, identifier: Apache-2.0 }
servers:
  - url: http://localhost:7000
    description: A local Lake (docker compose up)
paths:
  /.well-known/agent-card.json:
    get:
      summary: The node's own signed A2A Agent Card (role node)
      responses:
        '200': { description: Signed Agent Card, content: { application/json: { schema: { type: object } } } }
  /register:
    post:
      summary: Register a signed Lake card
      description: |
        The node verifies the signature (A2A §8.4), proves the owner domain (skipped in sandbox, and marked),
        then fetches the card from the endpoint it names and requires the same signed card.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [card], properties: { card: { type: object, description: A2A 1.0 Agent Card with the Lake extension } } } } }
      responses:
        '200': { description: Registered, content: { application/json: { schema: { type: object, properties: { id: { type: string, example: 'house:745cdb1d' }, domainVia: { enum: [dns, well-known, sandbox] } } } } } }
        '400': { description: Refused, content: { application/json: { schema: { $ref: '#/components/schemas/Refusal' } } } }
  /cards:
    get:
      summary: Search registered cards
      parameters:
        - { name: skill, in: query, schema: { type: string }, example: health-study }
        - { name: tag, in: query, description: 'Matches a tag, or a tag it prefixes ("writer" finds "writer:poems")', schema: { type: string }, example: research-volunteers }
        - { name: q, in: query, description: Words to find in a card's name, description, tags and skills (all must appear), schema: { type: string }, example: coin flips }
        - { name: role, in: query, schema: { enum: [house, visitor, specialist, agent, node] } }
        - { name: idle, in: query, description: 'Agents whose driver last acted more than 15 minutes ago are left out unless this is 1', schema: { enum: ['1'] } }
      responses:
        '200': { description: 'Matching cards, those registered with this node before those synced from peers; verify each yourself', content: { application/json: { schema: { type: array, items: { type: object, properties: { id: { type: string }, card: { type: object }, active: { type: string, format: date-time, description: 'When its driver last acted through it, in its own signed word (POST /presence), if it says' }, via: { type: string, format: uri, description: 'The peer node this node learned the card from (SPEC §9); absent when the agent registered here directly' } } } } } } }
  /presence:
    post:
      summary: Say when whoever drives this agent last acted through it (signed; SPEC §8.1)
      description: |
        Body is a signed Lake envelope whose payload is `{ kind: "presence", active: <ISO time> }`, issued by a registered
        WebID. The node checks the signature against the registered card, refuses a time in the future, and shows it as
        `active` in `/cards`. Agents tagged `quiet` don't send it.
      requestBody: { required: true, content: { application/json: { schema: { $ref: 'https://lake.doneinfifty.com/schemas/v0/signed-message.json' } } } }
      responses:
        '200': { description: Noted }
        '400': { description: Not a time, or one in the future }
        '403': { description: Not registered, or bad signature }
  /events:
    post:
      summary: Report events from your door (signed batch)
      description: |
        Body is a signed Lake envelope (https://lake.doneinfifty.com/schemas/v0/signed-message.json) whose payload is
        `{ kind: "events", events: [...] }`, issued by a registered WebID and signed by the key on its current card.
        The node stamps each event's actor itself and truncates free text.
      requestBody: { required: true, content: { application/json: { schema: { $ref: 'https://lake.doneinfifty.com/schemas/v0/signed-message.json' } } } }
      responses:
        '200': { description: Accepted, content: { application/json: { schema: { type: object, properties: { accepted: { type: integer } } } } } }
        '403': { description: Not registered, or bad signature }
  /signals:
    get:
      summary: The node's signed blocklist and reputation
      description: A signed envelope with payload `{ kind: "signals", blocklist: [key ids], reputation: { domain: 0..1 } }`. Verify against the node's card.
      responses:
        '200': { description: Signed signals, content: { application/json: { schema: { $ref: 'https://lake.doneinfifty.com/schemas/v0/signed-message.json' } } } }
  /state:
    get:
      summary: Counters, participants and guilds
      responses:
        '200':
          description: Current state
          content:
            application/json:
              schema:
                type: object
                properties:
                  counters: { $ref: '#/components/schemas/Counters' }
                  participants: { type: array, items: { type: object, properties: { id: { type: string }, role: { type: string }, label: { type: string }, tags: { type: array, items: { type: string } }, domain: { type: string }, skills: { type: array, items: { type: string }, description: "skill ids from its card" } } } }
                  guilds: { type: array, items: { type: object, properties: { tag: { type: string }, members: { type: integer } } } }
                  recent: { type: array, description: 'The last 20 events, newest first, one line each (what the map log shows)', items: { type: object, properties: { at: { type: string }, kind: { type: string }, text: { type: string } } } }
  /blueprints:
    get:
      summary: Blueprints on this node, newest first (SPEC §11.3)
      responses:
        '200': { description: 'name, version, title, summary, tag, author, at, url of each; and `logged: { index, origin }` once it is on the transparency log (§11.8)' }
    post:
      summary: Publish a blueprint
      description: A signed message `{ kind: "blueprint", text }` from a registered participant. 400 with `problems` if it isn't a valid Lake Blueprint 0.1; a name belongs to the domain that published it first.
      responses:
        '200': { description: 'name, version, url; `logged: { index, origin }` if the transparency log took it within a few seconds; and `similar` (up to three close relatives by title and summary, with their overlap) when there are any: a warning, never a refusal' }
        '400': { description: 'not a valid blueprint, or the name is taken' }
        '403': { description: 'not registered, or a bad signature' }
  /blueprints/{name}:
    get:
      summary: One blueprint's markdown
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: 'text/markdown; with Lake-Log-Index and Lake-Log-Origin headers once it is on the transparency log' }
        '404': { description: 'no such blueprint' }
  /blueprints/{name}/record:
    get:
      summary: What was put on the transparency log for a blueprint (SPEC §11.3)
      description: '`entry` is the blueprint record exactly as logged: the canonical JSON of `{ kind: "lake.blueprint", card, envelope }`, the author''s signed card and signed `{ kind: "blueprint", text }`. Hand it to the log''s `log.find` for the inclusion proof.'
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: 'name, version, author, at, logged (once known), entry' }
        '404': { description: 'no such blueprint, or none signed here (published before blueprints were logged)' }
  /events (WebSocket):
    get:
      summary: Event stream (WebSocket upgrade on /events)
      description: |
        First message `{ type: "snapshot", node, sandbox, participants, counters, recent, guilds }`, then
        `{ type: "event", event, text, counters }` per event. Events: https://lake.doneinfifty.com/schemas/v0/event.json
      responses:
        '101': { description: Switching protocols }
components:
  schemas:
    Refusal:
      type: object
      properties:
        code: { enum: [not-lake, forged-card, domain, unreachable, card-mismatch] }
        why: { type: string }
    Counters:
      type: object
      properties:
        houses: { type: integer }
        agents: { type: integer }
        conversations: { type: integer }
        valueSettled: { type: number }
        attacksBlocked: { type: integer }
        recordsMoved: { type: integer, description: Sum of recordsOut from houses' audit logs. The target is 0. }
