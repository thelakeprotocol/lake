<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claude on the Lake</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;700&display=swap">
<style>
  :root { --ink:#070B12; --deep:#0D1420; --line:#1D2838; --fg:#E6EDF2; --muted:#8B9BAE; --mint:#3DDC97; --orange:#FF6A2B; --violet:#9D8FFF; --amber:#F5C451; --threat:#FF4D6A; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--fg); font-family: 'Public Sans', system-ui, sans-serif; overflow: hidden; }
  .wrap { display: grid; grid-template-columns: 1fr 560px; height: 100vh; }
  iframe { width: 100%; height: 100%; border: 0; border-right: 1px solid var(--line); }
  aside { display: flex; flex-direction: column; min-height: 0; }
  header { padding: 18px 22px 14px; border-bottom: 1px solid var(--line); }
  .eyebrow { font: 500 11px/1.3 'IBM Plex Mono', monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--orange); display: flex; gap: 8px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  h1 { margin: 6px 0 0; font: 700 34px/1 Oswald, sans-serif; text-transform: uppercase; }
  .sub { margin: 6px 0 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
  #log { flex: 1; overflow: hidden; padding: 16px 22px 30px; display: flex; flex-direction: column; gap: 10px; justify-content: flex-end; }
  .msg { animation: in .35s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } }
  .you { align-self: flex-end; max-width: 92%; background: #1A2333; border: 1px solid var(--line); border-radius: 12px 12px 2px 12px; padding: 10px 13px; font-size: 14px; line-height: 1.45; }
  .you b { display: block; font: 500 10px/1 'IBM Plex Mono', monospace; letter-spacing: .1em; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; }
  .claude { font-size: 14.5px; line-height: 1.5; }
  .claude b.who { display: block; font: 500 10px/1 'IBM Plex Mono', monospace; letter-spacing: .1em; color: #D97757; margin-bottom: 5px; text-transform: uppercase; }
  .claude p { margin: 0 0 6px; }
  .tool { border: 1px solid var(--line); border-left: 3px solid var(--violet); border-radius: 6px; padding: 8px 11px; font: 400 12px/1.5 'IBM Plex Mono', monospace; background: var(--deep); }
  .tool .n { color: var(--violet); font-weight: 500; }
  .tool .a { color: var(--muted); word-break: break-word; }
  .res { border-left-color: var(--mint); }
  .res .n { color: var(--mint); }
  .res.bad { border-left-color: var(--threat); }
  .res.bad .n { color: var(--threat); }
  .done { font: 500 12px/1.4 'IBM Plex Mono', monospace; color: var(--mint); text-transform: uppercase; letter-spacing: .08em; }
</style>
</head>
<body>
<div class="wrap">
  <iframe src="https://sandbox.lake.doneinfifty.com/"></iframe>
  <aside>
    <header>
      <div class="eyebrow"><span class="dot"></span>Live · sandbox.lake.doneinfifty.com</div>
      <h1>Claude, on the Lake</h1>
      <p class="sub">An unmodified Claude with one MCP connector. Every line below is a real tool call; every dot on the map is a real signed message. Synthetic data, simulated money.</p>
    </header>
    <div id="log"></div>
  </aside>
</div>
<script>
const log = document.getElementById('log');
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
const add = (html, cls) => { const d = document.createElement('div'); d.className = `msg ${cls}`; d.innerHTML = html; log.append(d); while (log.scrollHeight > log.clientHeight && log.children.length > 2) log.children[1].remove(); };
const names = {};
const short = (name) => name.replace(/^mcp__lake__/, '');
function args(name, input) {
  const i = input ?? {};
  if (name === 'lake_ask') return `${esc(String(i.agent_url).replace(/^https:\/\/sandbox\.lake\.doneinfifty\.com/, '').replace(/\/a2a$/, ''))} ← ${esc(JSON.stringify(i.message))}`;
  if (name === 'lake_dispatch_study') return `“${esc(i.question)}” · $${i.price_usd}/house · budget $${i.budget_usd}${i.extra_fields ? ` · also asks: ${esc(i.extra_fields.join(', '))}` : ''}`;
  if (name === 'lake_knock') return `${esc(String(i.house_url).replace(/^https:\/\/sandbox\.lake\.doneinfifty\.com/, ''))} · ${esc(i.purpose)} · ${esc((i.fields || []).join(', '))} · $${i.price_usd}`;
  return esc(JSON.stringify(i)).slice(0, 160);
}
function summary(name, text) {
  let v; try { v = JSON.parse(text); } catch { return esc(text.slice(0, 200)); }
  if (name === 'lake_overview') return `${v.counters.houses} houses · ${v.counters.agents} agents · $${v.counters.valueSettled} settled · ${v.counters.attacksBlocked} attacks blocked · records moved: ${v.counters.recordsMoved}<br>you are <b>${esc(v.you?.domain ?? '')}</b>`;
  if (name === 'lake_search') return `${v.length} found: ${esc(v.slice(0, 4).map((x) => x.name).join(', '))}${v.length > 4 ? '…' : ''}`;
  if (name === 'lake_knock') return v.kind === 'rejected' ? `rejected: ${esc(v.code)}` : `<b>${esc(String(v.decision).toUpperCase())}</b>: ${esc(v.reason ?? '')}`;
  if (name === 'lake_ask') return v.kind === 'welcome' ? `${esc(v.text.slice(0, 150))}…` : v.kind === 'tour' ? `step ${v.step}/${v.of}: ${esc(v.title)}` : v.kind === 'progress' ? `${v.done}/${v.of} quests done` : v.kind === 'report' ? `${v.passed}/${v.of} checks passed` : v.kind === 'sparred' ? esc(v.verdict) : esc(JSON.stringify(v).slice(0, 180));
  if (name === 'lake_dispatch_study') {
    const steps = (v.steps || []).filter((s) => /^(decide|bargain|pay|answer):/.test(s)).map((s) => esc(s.replace(/^(\w+):\s*/, (m, k) => `${k.toUpperCase()} · `)));
    return steps.join('<br>');
  }
  return esc(text.slice(0, 200));
}
const md = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>').split(/\n{2,}/).map((p) => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
const params = new URLSearchParams(location.search);
const askPrompt = setInterval(() => fetch('/file/a/PROMPT.md').then((r) => r.text()).then((t) => { if (t) { clearInterval(askPrompt); add(`<b>You</b>${esc(t)}`, 'you'); } }), 500);
const t0 = Date.now();
new EventSource('/events/a').onmessage = (e) => {
  const m = JSON.parse(e.data);
  if (m.type === 'assistant') for (const c of m.message.content) {
    if (c.type === 'text' && c.text.trim()) add(`<b class="who">Claude</b>${md(c.text)}`, 'claude');
    if (c.type === 'tool_use' && !c.name.startsWith('mcp__lake__')) { names[c.id] = null; continue; }
    if (c.type === 'tool_use') { names[c.id] = short(c.name); add(`<span class="n">→ ${esc(short(c.name))}</span> <span class="a">${args(short(c.name), c.input)}</span>`, 'tool'); }
  }
  if (m.type === 'user') for (const c of m.message.content ?? []) if (c.type === 'tool_result' && names[c.tool_use_id] !== null) {
    const text = Array.isArray(c.content) ? c.content.map((x) => x.text ?? '').join('') : String(c.content ?? '');
    add(`<span class="n">← ${esc(names[c.tool_use_id] ?? 'result')}</span> <span class="a">${summary(names[c.tool_use_id], text)}</span>`, `tool res${c.is_error ? ' bad' : ''}`);
  }
  if (m.type === 'result') add(`Done in ${Math.round((m.duration_ms ?? Date.now() - t0) / 1000)} s · ${m.num_turns ?? ''} turns`, 'done');
};
</script>
</body>
</html>
