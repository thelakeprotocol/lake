# The public sandbox behind an Apache that already serves other sites on 80/443.
#   sudo cp deploy/apache-sandbox.conf /etc/apache2/sites-available/010-lake-sandbox.conf   (edit ServerName)
#   sudo a2enmod proxy proxy_http proxy_wstunnel && sudo a2ensite 010-lake-sandbox
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot --apache --redirect -d sandbox.lake.example       (adds the HTTPS twin of this vhost)
# Needs Apache 2.4.47+ for upgrade=websocket (the map's event stream and the relay are WebSockets).
<VirtualHost *:80>
	ServerName sandbox.lake.doneinfifty.com
	ProxyPreserveHost On
	ProxyTimeout 120
	# Keep-alive on both sides, so neither end closes a connection the other is about to use (a closed one surfaces as
	# ECONNRESET, and the client can't tell whether its request was acted on). Clients: 65 s idle. Backends: Apache reuses
	# a pooled connection for at most 60 s idle (ttl=60), and the Lake's servers keep theirs 130 s (keepAliveBehindProxy).
	# The pod server keeps Node's default 5 s, so its pool gets ttl=4. Certbot copies these into the HTTPS twin.
	KeepAliveTimeout 65
	MaxKeepAliveRequests 1000
	# The specialists: /s/guide/a2a, /s/inspector/a2a, …
	ProxyPass        /s/ http://127.0.0.1:4300/ ttl=60
	ProxyPassReverse /s/ http://127.0.0.1:4300/
	# The MCP connector over HTTP (streams: no buffering, long timeout)
	ProxyPass        /mcp http://127.0.0.1:4800/mcp flushpackets=on timeout=600 ttl=60
	ProxyPassReverse /mcp http://127.0.0.1:4800/mcp
	# Hosted houses: /t/<name>/a2a, /t/<name>/owner/
	# The hosted houses' pods, at a public address: the pod server must see the public host and HTTPS.
	<Location /pods/>
		ProxyPreserveHost On
		RequestHeader set X-Forwarded-Proto "https"
		ProxyPass http://127.0.0.1:4310/pods/ ttl=4
		ProxyPassReverse http://127.0.0.1:4310/pods/
	</Location>
	ProxyPass        /t/ http://127.0.0.1:4000/t/ ttl=60
	ProxyPassReverse /t/ http://127.0.0.1:4000/t/
	# The node: map, registry, events (WebSocket), signals, relay (WebSocket)
	ProxyPass        / http://127.0.0.1:7000/ upgrade=websocket ttl=60
	ProxyPassReverse / http://127.0.0.1:7000/
	ErrorLog ${APACHE_LOG_DIR}/lake-sandbox-error.log
	CustomLog ${APACHE_LOG_DIR}/lake-sandbox-access.log combined
</VirtualHost>
