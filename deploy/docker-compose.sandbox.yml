# The public sandbox Lake: synthetic data, simulated money, real signatures, open to anyone's agent.
# Sized by default for a small shared server (1 GB RAM): every container has a hard memory cap and no swap, so if
# something misbehaves Docker restarts it rather than starving whatever else runs on the machine. Keep the caps'
# sum below the machine's RAM with room for the OS: on 1 GB, ten houses plus the grocers didn't fit (the host
# swapped until it stopped answering). Each cap is an env var (LAKE_<SERVICE>_MEM, LAKE_HOUSES_HEAP, LAKE_MCP_HEAP);
# on a 2 GB server: houses 700m (heap 448), mcp 260m (heap 200), specialists 240m, node 180m, sponsor 120m,
# grocers 110m, swarm 100m.
#
#   LAKE_DOMAIN=sandbox.lake.example docker compose -f deploy/docker-compose.sandbox.yml up -d
#
# Everything listens on 127.0.0.1 only. Put HTTPS in front with the web server you already run
# (deploy/apache-sandbox.conf), or with Caddy if ports 80/443 are free (--profile caddy, deploy/Caddyfile):
#   /        the node: live map, registry, events, signals, relay
#   /s/*     the specialists: /s/guide /s/inspector /s/sparring /s/quests /s/ethics /s/auditor /s/payments /s/issuer
#   /mcp     the Lake MCP connector over HTTP (Claude as a Lake agent)
#   /pods/*  the hosted houses' Solid pods (public WebIDs)
#   /t/*     the hosted houses (anyone can claim one: the first device to open /t/<name>/owner/ becomes its owner)
name: lake-sandbox

x-small: &small
  restart: unless-stopped
  logging: { driver: json-file, options: { max-size: "5m", max-file: "2" } }

services:
  lake-node:
    <<: *small
    image: ghcr.io/thelakeprotocol/lake-node:latest
    hostname: lake-node
    command: ["--domain", "${LAKE_DOMAIN:?set LAKE_DOMAIN}", "--url", "https://${LAKE_DOMAIN}", "--guild-min", "2"]
    # The map's QR code: how to claim a hosted house.
    # Published blueprints go on the transparency log, which runs with the specialists.
    environment: { NODE_OPTIONS: "--max-old-space-size=96", LAKE_APPROVALS_URL: "https://lake.doneinfifty.com/docs/sandbox#claim-a-house", LAKE_LOG_URL: "http://specialists:4300/log/a2a" }
    volumes: [node:/data]
    ports: ["127.0.0.1:7000:7000"]
    mem_limit: ${LAKE_NODE_MEM:-160m}
    memswap_limit: ${LAKE_NODE_MEM:-160m}

  specialists:
    <<: *small
    image: ghcr.io/thelakeprotocol/lake-specialists:latest
    hostname: specialists
    command: ["all", "--port", "4300", "--url", "https://${LAKE_DOMAIN}/s", "--public-node", "https://${LAKE_DOMAIN}", "--spar-every", "1800", "--packs", "health,shopping"]
    environment: { NODE_OPTIONS: "--max-old-space-size=128", LAKE_NODE_URL: "http://lake-node:7000" }
    volumes: [specialists:/data]
    ports: ["127.0.0.1:4300:4300"]
    depends_on: [lake-node]
    # The grocers ask the food register for their authorisation at start: they wait for this (and retry while it isn't up).
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://localhost:4300/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"], interval: 10s, timeout: 4s, retries: 3, start_period: 90s }
    mem_limit: ${LAKE_SPECIALISTS_MEM:-200m}
    memswap_limit: ${LAKE_SPECIALISTS_MEM:-200m}

  # A handful of hosted houses, so there's someone to knock on from minute one.
  houses:
    <<: *small
    image: ghcr.io/thelakeprotocol/lake-house:latest
    hostname: houses
    # --pod-url: the houses' storage at a public HTTPS address, so their WebIDs and signatures can be checked by anyone.
    command: ["--tenants", "${LAKE_TENANTS:-6}", "--tenant-prefix", "sb-", "--public-url", "https://${LAKE_DOMAIN}", "--pod-url", "https://${LAKE_DOMAIN}/pods/", "--open-pairing"]
    environment:
      NODE_OPTIONS: "--max-old-space-size=${LAKE_HOUSES_HEAP:-256}"
      # Two houses start at a time: ten pods starting together overloaded the 1 GB droplet after deploys (run 28).
      LAKE_START_CONCURRENCY: "${LAKE_START_CONCURRENCY:-2}"
      # Houses kept for someone: no lease, not on the claim list, paired with the token in their data folder.
      LAKE_KEPT: "${LAKE_KEPT:-}"
      LAKE_NODE_URL: "http://lake-node:7000"
      LAKE_ISSUER_URL: "http://specialists:4300/issuer"
      # Health and the weekly shop (shopping@1); never mortgage on the sandbox.
      LAKE_PACKS: "health,shopping"
      LAKE_ISSUERS: "health=http://specialists:4300/issuer,shopping=http://specialists:4300/receipts"
      LAKE_AUDITOR_URL: "http://specialists:4300/auditor"
      LAKE_PERSON_URL: "http://specialists:4300/person"
      # Houses trust tellers only at the addresses the operator vouches for (a sandbox proves no domains).
      LAKE_TELLERS: "https://${LAKE_DOMAIN}/s/teller-a/a2a,https://${LAKE_DOMAIN}/s/teller-b/a2a"
    volumes: [houses:/data]
    ports: ["127.0.0.1:4000:4000", "127.0.0.1:4310:3000"]
    depends_on: [specialists]
    # ~200 MB of pod server plus a little per house; give 50 MB more for every 4 houses past 6.
    mem_limit: ${LAKE_HOUSES_MEM:-400m}
    memswap_limit: ${LAKE_HOUSES_MEM:-400m}

  # Sandbox life: a paid, certified study every 15 minutes, rotating questions and prices.
  sponsor:
    <<: *small
    image: ghcr.io/thelakeprotocol/lake:latest
    hostname: sponsor
    command: ["sponsor", "--every", "900", "--node", "http://lake-node:7000", "--ethics", "http://specialists:4300/ethics", "--auditor", "http://specialists:4300/auditor", "--payments", "http://specialists:4300/payments", "--budget", "1000000"]
    environment: { NODE_OPTIONS: "--max-old-space-size=96" }
    volumes: [cli:/root/.lake]
    depends_on: [houses]
    mem_limit: ${LAKE_SPONSOR_MEM:-140m}
    memswap_limit: ${LAKE_SPONSOR_MEM:-140m}

  # Claude (or any MCP client) as a Lake agent, over HTTP: add https://<domain>/mcp as a custom connector.
  # Every conversation gets its own key and card, served from here at /mcp/a/<id>/.
  mcp:
    <<: *small
    image: ghcr.io/thelakeprotocol/lake:latest
    hostname: mcp
    command: ["mcp", "--http", "4800", "--public-url", "https://${LAKE_DOMAIN}"]
    environment:
      NODE_OPTIONS: "--max-old-space-size=${LAKE_MCP_HEAP:-128}"
      LAKE_NODE_URL: "http://lake-node:7000"
      LAKE_ETHICS_URL: "http://specialists:4300/ethics"
      LAKE_AUDITOR_URL: "http://specialists:4300/auditor"
      LAKE_PAYMENTS_URL: "http://specialists:4300/payments"
      LAKE_PUBLIC_NODE_URL: "https://${LAKE_DOMAIN}"
      # The use cases the sandbox runs: the connector knows their fields (to say when a blueprint names them).
      LAKE_PACKS: "health,shopping"
      # Play money each conversation's agent may pay other agents (lake_pay), signed by the sandbox in its human's place.
      LAKE_ALLOWANCE_USD: "50"
    ports: ["127.0.0.1:4800:4800"]
    depends_on: [houses]
    mem_limit: ${LAKE_MCP_MEM:-180m}
    memswap_limit: ${LAKE_MCP_MEM:-180m}

  # Three demo grocers (shopping@1): they price households' weekly shops inside their houses.
  grocers:
    <<: *small
    image: ghcr.io/thelakeprotocol/lake:latest
    hostname: grocers
    command: ["quoters", "--packs", "shopping", "--port", "4810", "--public-url", "http://grocers:4810", "--node", "http://lake-node:7000", "--auditor", "http://specialists:4300/auditor", "--authority", "http://specialists:4300/foodregister", "--payments", "http://specialists:4300/payments"]
    environment: { NODE_OPTIONS: "--max-old-space-size=64" }
    depends_on: { specialists: { condition: service_healthy } }
    mem_limit: ${LAKE_GROCERS_MEM:-100m}
    memswap_limit: ${LAKE_GROCERS_MEM:-100m}

  # Background traders (mostly marketing, which rules decline) and an attacker now and then.
  # Off by default: on a 1 GB server the houses need the room. --profile lively turns it on.
  swarm:
    <<: *small
    profiles: [lively]
    image: ghcr.io/thelakeprotocol/lake:latest
    command: ["swarm", "--traders", "3", "--attackers", "1", "--interval", "30000", "--node", "http://lake-node:7000"]
    environment: { NODE_OPTIONS: "--max-old-space-size=64" }
    depends_on: [houses]
    mem_limit: ${LAKE_SWARM_MEM:-100m}
    memswap_limit: ${LAKE_SWARM_MEM:-100m}

  caddy:
    profiles: [caddy]
    image: caddy:2.8.4
    restart: unless-stopped
    network_mode: host
    environment: { LAKE_DOMAIN: "${LAKE_DOMAIN}" }
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy:/data]

volumes: { node: {}, specialists: {}, houses: {}, cli: {}, caddy: {} }
