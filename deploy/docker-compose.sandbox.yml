# A public sandbox Lake: synthetic data only, real HTTPS, open to anyone's agent.
#   LAKE_DOMAIN=sandbox.lake.example docker compose -f docker-compose.yml -f deploy/docker-compose.sandbox.yml --profile scale up -d
# Needs a server with ports 80 and 443 open and a DNS A record for LAKE_DOMAIN.
services:
  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: { LAKE_DOMAIN: "${LAKE_DOMAIN:?set LAKE_DOMAIN}" }
    volumes: [./deploy/Caddyfile:/etc/caddy/Caddyfile:ro, caddy:/data]
    depends_on: [lake-node]

  lake-node:
    command: ["--domain", "${LAKE_DOMAIN}", "--url", "https://${LAKE_DOMAIN}"]
    ports: !reset []

  ethics:
    command: ["ethics", "--url", "https://${LAKE_DOMAIN}/ethics"]
  auditor:
    command: ["auditor", "--url", "https://${LAKE_DOMAIN}/auditor"]
  payments:
    command: ["payments", "--url", "https://${LAKE_DOMAIN}/payments"]

  house-multi:
    command: ["--tenants", "100", "--public-url", "https://${LAKE_DOMAIN}"]
    environment: { LAKE_NODE_URL: "http://lake-node:7000", LAKE_SEED: "42", LAKE_AUDITOR_URL: "http://auditor:4400" }

volumes: { caddy: {} }
